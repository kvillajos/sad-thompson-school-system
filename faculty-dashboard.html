<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Dashboard | TCSMS</title>
  </head>
  <body>
    <header><h1>Faculty Dashboard</h1></header>
    <main><section class="welcome"><h2>Welcome, <span id="user-name"></span></h2><p>Your faculty workspace will contain assigned classes, student attendance, grades, and teaching-related records.</p></section></main>
    <script type="module">
      import { requireRole, signOut } from './auth-client.js'
      import { hideLoadingScreen } from './loading-screen.js'
      import { applyUiTheme, mountProfile } from './ui-theme.js'
      applyUiTheme()
      const user = await requireRole(3)
      if (user) { document.getElementById('user-name').textContent = user.username; mountProfile(user, 'Faculty', signOut) }
      hideLoadingScreen()
    </script>
  </body>
</html>
