<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thompson Christian School Management System</title>
    <style>
      :root { color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100vh; background: #071b3a; }
      .login-layout { display: grid; grid-template-columns: minmax(280px, 40%) 1fr; min-height: 100vh; }
      .login-panel { display: flex; flex-direction: column; justify-content: center; padding: 2rem clamp(1.5rem, 5vw, 3rem); background: #071b3a; }
      .brand-lockup { display: flex; align-items: center; justify-content: space-between; gap: .5rem; width: min(100%, 310px); margin: 0 auto 1.25rem; }
      .brand-copy { color: #fff; line-height: 1.1; }
      .brand-name { font-size: clamp(1.15rem, 3vw, 1.55rem); font-weight: 700; letter-spacing: -.03em; }
      .brand-name span { color: #2864c7; }
      .brand-tagline { margin-top: .25rem; font-size: .55rem; }
      .brand-logo { display: block; width: 92px; height: 92px; object-fit: contain; }
      .card { width: min(100%, 310px); margin: 0 auto; }
      h2 { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .form-group { margin-bottom: .5rem; }
      label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      input { width: 100%; padding: .62rem .7rem; border: 0; border-radius: 4px; background: #e7ebf0; color: #172b4d; font-size: .7rem; }
      input::placeholder { color: #8a96a6; }
      input:focus { outline: 2px solid #4c8bf5; outline-offset: 1px; }
      button { width: 100%; padding: .62rem; border: 0; border-radius: 4px; background: #2864c7; color: white; font-size: .7rem; cursor: pointer; transition: background .2s; }
      button:hover { background: #3476df; }
      #message { margin-top: 1rem; text-align: center; font-size: 0.9rem; font-weight: 600; }
      .hidden { display: none; }
      .dashboard-info { background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 1rem; }
      .dashboard-info p { margin-bottom: 0.5rem; color: #334155; }
      .login-photo { min-height: 100vh; background: url('/assets/bg-Q8X2SFg6.jpg') center / cover no-repeat; }
      .logout-btn { background-color: #dc2626; margin-top: 1rem; }
      .logout-btn:hover { background-color: #b91c1c; }
      @media (max-width: 700px) {
        .login-layout { grid-template-columns: 1fr; }
        .login-panel { min-height: 100vh; }
        .login-photo { display: none; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CJUJ4So8.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/loading-screen-CBKu0TMq.js">
  </head>
  <body>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS sign in">
        <div id="login-container" class="card">
          <div class="brand-lockup">
            <div class="brand-copy">
              <p class="brand-name">Thompson <span>Christian</span></p>
              <p class="brand-tagline">School Management System</p>
            </div>
            <img class="brand-logo" src="/assets/logo-CTpbETT5.png" alt="Thompson Christian School seal" />
          </div>
          <h2>TCSMS Login</h2>
          <form id="login-form">
            <div class="form-group">
              <label for="username">Username or Email</label>
              <input type="text" id="username" placeholder="Username or Email" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
            </div>
            <button type="submit">Sign In</button>
          </form>
          <div id="message"></div>
        </div>

        <div id="dashboard-container" class="card hidden">
          <h2>Dashboard</h2>
          <div class="dashboard-info">
            <p><strong>User:</strong> <span id="user-display"></span></p>
            <p><strong>Email:</strong> <span id="email-display"></span></p>
            <p><strong>Status:</strong> Active Session</p>
          </div>
          <button id="logout-btn" class="logout-btn">Sign Out</button>
        </div>
      </section>
      <aside class="login-photo" aria-label="Thompson Christian School campus"></aside>

  </body>
</html>
