<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <title>Manage Subjects | TCSMS</title>
</head>
<body class="admin-shell">
<div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#102a43"></div>
  <main>
    <div class="admin-page-head"><div><h2>Manage Subjects</h2><p>Create and maintain the subjects available to sections.</p></div></div>
    <div class="admin-filterbar"><input id="subject-search" type="search" placeholder="Search subject code or name"><select id="subject-status"><option value="">All statuses</option><option value="true">Active</option><option value="false">Inactive</option></select><button id="add-subject" class="admin-primary admin-action" type="button">+ Add Subject</button></div>
    <section class="admin-table-wrap"><table><thead><tr><th>Code</th><th>Subject</th><th>Grade</th><th>Status</th><th>Actions</th></tr></thead><tbody id="subjects-table"><tr><td colspan="5">Loading subjects...</td></tr></tbody></table></section>
  </main>
  <div id="subject-modal" class="admin-modal hidden"><div class="admin-modal-box"><div class="admin-modal-head"><h3 id="subject-modal-title">Add Subject</h3><button type="button" id="close-subject">x</button></div><form id="subject-form"><input type="hidden" name="subject_id"><label>Code<input name="subject_code" placeholder="e.g. MATH-7" required></label><label>Subject Name<input name="subject_name" placeholder="e.g. Mathematics" required></label><label>Grade<select name="grade_level"></select></label><label>Status<select name="is_active"><option value="true">Active</option><option value="false">Inactive</option></select></label><label class="admin-full">Description<textarea name="description" rows="3"></textarea></label><div class="admin-actions"><button type="button" id="cancel-subject" class="admin-cancel">Cancel</button><button class="admin-primary" type="submit">Save Subject</button></div></form></div></div>
  <script type="module" src="/admin-subjects-page.js"></script>
</body>
</html>
