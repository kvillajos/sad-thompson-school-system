<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Enter Reset Code · Thompson Christian School Management System</title>
  </head>
  <body class="login-page">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#091c3c"></div>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS verify reset code">
        <div id="verify-code-container" class="login-card">
          <div class="brand-lockup">
            <img class="brand-logo" src="/assets/logo.png" alt="Thompson Christian School seal" width="56" height="56" />
            <div class="brand-copy">
              <p class="brand-name">Thompson Christian School</p>
              <p class="brand-tagline">School Management System</p>
            </div>
          </div>
          <h1 class="login-title">Enter your reset code</h1>
          <p class="login-lead">We emailed a code to the address you entered. Enter it below.</p>
          <form id="verify-code-form">
            <div class="form-group">
              <label for="code">Reset code</label>
              <input maxlength="8" type="text" id="code" class="login-code" required autocomplete="one-time-code" inputmode="numeric" />
            </div>
            <button type="submit">Verify code</button>
          </form>
          <div id="message" role="alert"></div>
          <p class="login-foot">Didn't get a code? <a href="/forgot-password.html">Start over</a></p>
        </div>
      </section>
      <aside class="login-photo" aria-label="Thompson Christian School campus">
        <p class="login-photo-caption">Thompson Christian School, Davao City</p>
      </aside>
    </div>

    <script type="module" src="/auth/verify-reset-code-page.js"></script>
  </body>
</html>
