<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" type="image/png" href="/assets/logo.png"><title>Manage Accounts | TCSMS</title></head>
<body class="admin-shell">
<div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#102a43"></div>
<main>
  <div class="admin-page-head"><div><h2>Manage Accounts</h2><p>Review users and their access roles. Staff accounts are added here; student accounts are created when their admission is approved.</p></div></div>
  <div class="admin-filterbar"><input maxlength="100" id="account-search" type="search" placeholder="Search username or email"><select id="account-role"><option value="">All roles</option><option value="1">Administrator</option><option value="2">Registrar</option><option value="3">Faculty</option><option value="4">Student</option></select><button id="add-account" class="admin-primary" type="button">Add Account</button></div>
  <section class="admin-table-wrap"><table><thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Linked Record</th><th>Date Added</th><th>Actions</th></tr></thead><tbody id="accounts-table"><tr><td colspan="7">Loading accounts...</td></tr></tbody></table></section>
</main>
<div id="account-details-modal" class="admin-modal hidden"><div class="admin-modal-box account-details-box"><div class="admin-modal-head"><h3>Account Details</h3><button type="button" id="close-account-details">x</button></div><div id="account-details-body"></div></div></div>
<script type="module" src="/role-admin/admin-accounts-page.js"></script>
</body>
</html>
