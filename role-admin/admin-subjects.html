<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Manage Subjects | TCSMS</title>
  </head>
  <body class="admin-shell">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#091c3c"></div>
    <main>
      <div class="admin-page-head">
        <div><h2>Manage Subjects</h2></div>
      </div>
      <div class="admin-filterbar">
        <input maxlength="100" id="subject-search" type="search" placeholder="Search subject code or name" /><select id="subject-status">
          <option value="">All statuses</option>
          <option value="true">Active</option>
          <option value="false">Inactive</option></select
        ><button id="add-subject" class="admin-primary admin-action" type="button">+ Add Subject</button>
      </div>
      <section class="admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Subject</th>
              <th>Grade Level</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="subjects-table">
            <tr>
              <td colspan="5">Loading subjects...</td>
            </tr>
          </tbody>
        </table>
      </section>
      <section class="admin-table-wrap lunch-card scale-card">
        <div class="admin-section-title">
          <div><h3>Grading scale</h3></div>
          <label class="scale-year">School year<select id="scale-year" form="scale-form"></select></label>
        </div>
        <form id="scale-form" class="scale-form">
          <table class="scale-table" data-no-sort>
            <thead>
              <tr>
                <th>Description</th>
                <th>From</th>
                <th>Letter</th>
              </tr>
            </thead>
            <tbody id="scale-rows"></tbody>
          </table>
          <button class="admin-primary lunch-save" type="submit">Save scale</button>
        </form>
        <p class="admin-note" id="scale-note"></p>
      </section>
    </main>
    <div id="subject-modal" class="admin-modal hidden">
      <div class="admin-modal-box">
        <div class="admin-modal-head">
          <h3 id="subject-modal-title">Add Subject</h3>
          <button type="button" id="close-subject">x</button>
        </div>
        <form id="subject-form">
          <input type="hidden" name="subject_id" /><label
            >Code<input maxlength="20" name="subject_code" placeholder="e.g. MATH-7" required /></label
          ><label>Subject Name<input maxlength="100" name="subject_name" placeholder="e.g. Mathematics" required /></label
          ><small class="admin-note admin-full"
            >Renaming a subject does not change grades already recorded under the old name; they stay listed under it.</small
          >
          <div class="admin-full">
            <label>Grade Level</label>
            <div id="subject-grade-picker" class="grade-picker grade-picker-compact"></div>
          </div>
          <label
            >Status<select name="is_active">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select></label
          ><label class="admin-full">Description<textarea maxlength="300" name="description" rows="3"></textarea></label>
          <div class="admin-actions">
            <button type="button" id="cancel-subject" class="admin-cancel">Cancel</button
            ><button class="admin-primary" type="submit">Save Subject</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/role-admin/admin-subjects-page.js"></script>
  </body>
</html>
