<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Admissions | TCSMS</title>
  </head>

  <body class="admin-shell">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#091c3c"></div>

    <main>
      <div class="admin-page-head">
        <div>
          <h2>Admissions</h2>
          <p>Review each application here, then approve or decline it. The Dashboard shows how many are waiting.</p>
        </div>
      </div>

      <section class="admin-table-wrap">
        <div class="admin-section-title">
          <h3>Applications Awaiting Review <span class="badge pending" id="admissions-count"></span></h3>
          <button id="refresh-admissions" class="admin-secondary" type="button">Refresh</button>
        </div>
        <input
          maxlength="100"
          id="admission-search"
          type="search"
          placeholder="Search applicant name or application ID..."
          aria-label="Search applications"
        />

        <table>
          <thead>
            <tr>
              <th>Application ID</th>
              <th>Applicant</th>
              <th>Grade Level</th>
              <th>Status</th>
              <th>Requirements</th>
              <th>Date Submitted</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="admission-rejection-table">
            <tr>
              <td colspan="7">Loading applications...</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="admin-table-wrap lunch-card" id="requirement-types-host"></section>
    </main>

    <script type="module" src="/role-admin/admin-admissions-page.js"></script>
  </body>
</html>
