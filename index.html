<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Thompson Christian School Management System</title>
  </head>
  <body>
    <div id="tcsms-loading-screen" class="loading-screen" role="status" aria-label="Loading Thompson Christian School Management System" style="position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:.5rem;background:#102a43;color:#f7fbff">
      <div class="loading-mark" aria-hidden="true" style="display:grid;place-items:center;width:4.25rem;height:4.25rem;margin-bottom:.4rem;border:2px solid #f0b429;border-radius:50%;color:#f0b429;font-family:Georgia,serif;font-size:2rem;font-weight:700">T</div>
      <p class="loading-title" style="margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.12em">TCSMS</p>
      <p class="loading-subtitle" style="margin:0;color:#bcccdc;font-size:.85rem">Preparing your workspace</p>
      <div class="loading-spinner" aria-hidden="true" style="width:1.25rem;height:1.25rem;margin-top:.8rem;border:2px solid rgba(255,255,255,.25);border-top-color:#f0b429;border-radius:50%"></div>
    </div>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS sign in">
        <div id="login-container" class="card">
          <div class="brand-lockup">
            <div class="brand-copy">
              <p class="brand-name">Thompson <span>Christian</span></p>
              <p class="brand-tagline">School Management System</p>
            </div>
            <img class="brand-logo" src="/assets/logo.png" alt="Thompson Christian School seal" />
          </div>
          <h2>TCSMS Login</h2>
          <form id="login-form">
            <div class="form-group">
              <label for="username">Username or Email</label>
              <input type="text" id="username" placeholder="Username or Email" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
            </div>
            <button type="submit">Sign In</button>
          </form>
          <div id="message"></div>
          <p id="app-version" class="app-version"></p>
        </div>

        <div id="dashboard-container" class="card hidden">
          <h2>Dashboard</h2>
          <div class="dashboard-info">
            <p><strong>User:</strong> <span id="user-display"></span></p>
            <p><strong>Email:</strong> <span id="email-display"></span></p>
            <p><strong>Status:</strong> Active Session</p>
          </div>
          <button id="logout-btn" class="logout-btn">Sign Out</button>
        </div>
      </section>
      <aside class="login-photo" aria-label="Thompson Christian School campus"></aside>

    <script type="module" src="/main.js"></script>
  </body>
</html>
