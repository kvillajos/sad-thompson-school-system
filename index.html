<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thompson Christian School Management System</title>
  </head>
  <body>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS sign in">
        <div id="login-container" class="card">
          <div class="brand-lockup">
            <div class="brand-copy">
              <p class="brand-name">Thompson <span>Christian</span></p>
              <p class="brand-tagline">School Management System</p>
            </div>
            <img class="brand-logo" src="/logo.png" alt="Thompson Christian School seal" />
          </div>
          <h2>TCSMS Login</h2>
          <form id="login-form">
            <div class="form-group">
              <label for="username">Username or Email</label>
              <input type="text" id="username" placeholder="Username or Email" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
            </div>
            <button type="submit">Sign In</button>
          </form>
          <div id="message"></div>
        </div>

        <div id="dashboard-container" class="card hidden">
          <h2>Dashboard</h2>
          <div class="dashboard-info">
            <p><strong>User:</strong> <span id="user-display"></span></p>
            <p><strong>Email:</strong> <span id="email-display"></span></p>
            <p><strong>Status:</strong> Active Session</p>
          </div>
          <button id="logout-btn" class="logout-btn">Sign Out</button>
        </div>
      </section>
      <aside class="login-photo" aria-label="Thompson Christian School campus"></aside>

    <script type="module" src="/main.js"></script>
  </body>
</html>
