<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#091c3c" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Thompson Christian School Management System</title>
  </head>

  <body class="login-page">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#091c3c" aria-hidden="true"></div>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS sign in">
        <div id="login-container" class="login-card">
          <div class="brand-lockup">
            <img class="brand-logo" src="/assets/logo.png" alt="Thompson Christian School seal" width="56" height="56" />
            <div class="brand-copy">
              <p class="brand-name">Thompson Christian School</p>
              <p class="brand-tagline">School Management System</p>
            </div>
          </div>

          <!-- Public announcements appear here on phones -->
          <div id="mobile-maintenance-notices" class="mobile-maintenance-notices" aria-live="polite"></div>

          <h1 class="login-title">Sign in</h1>
          <p class="login-lead">Use your username or school email and your password.</p>

          <form id="login-form">
            <div class="form-group">
              <label for="username">Username or email</label>
              <input maxlength="150" type="text" id="username" required autocomplete="username" autocapitalize="none" spellcheck="false" />
            </div>

            <div class="form-group">
              <div class="login-label-row">
                <label for="password">Password</label>
                <a href="/forgot-password.html">Forgot password?</a>
              </div>
              <input maxlength="128" type="password" id="password" required autocomplete="current-password" />
            </div>

            <button type="submit">Sign in</button>
          </form>

          <div id="message" role="status" aria-live="polite"></div>
          <p id="app-version" class="app-version"></p>
        </div>
      </section>

      <!-- Desktop campus photo and announcements -->
      <aside class="login-photo" aria-label="Thompson Christian School campus">
        <div id="maintenance-notices"></div>
        <p class="login-photo-caption">Thompson Christian School, Davao City</p>
      </aside>
    </div>

    <script type="module" src="/auth/login-page.js"></script>
  </body>
</html>
