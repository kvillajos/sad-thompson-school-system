<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Thompson Christian School Management System</title>
  </head>
  <body>
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#102a43"></div>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS sign in">
        <div id="login-container" class="card">
          <div class="brand-lockup">
            <div class="brand-copy">
              <p class="brand-name">Thompson <span>Christian</span></p>
              <p class="brand-tagline">School Management System</p>
            </div>
            <img class="brand-logo" src="/assets/logo.png" alt="Thompson Christian School seal" />
          </div>
          <h2>TCSMS Login</h2>
          <form id="login-form">
            <div class="form-group">
              <label for="username">Username or Email</label>
              <input type="text" id="username" placeholder="Username or Email" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
            </div>
            <button type="submit">Sign In</button>
          </form>
          <div id="message"></div>
          <p id="app-version" class="app-version"></p>
        </div>

      </section>
      <aside class="login-photo" aria-label="Thompson Christian School campus"><div id="maintenance-notices"></div></aside>

    <script type="module" src="/main.js"></script>
  </body>
</html>
