<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" type="image/png" href="/assets/logo.png"><title>Manage Faculty | TCSMS</title></head>
<body class="admin-shell">
<div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#102a43"></div>
<main>
  <div class="admin-page-head"><div><h2>Manage Faculty</h2><p>Review faculty profiles, departments, and teaching specializations.</p></div></div>
  <div class="admin-filterbar"><input id="faculty-search" type="search" placeholder="Search faculty or department"></div>
  <section class="admin-table-wrap"><table><thead><tr><th>Employee No.</th><th>Name</th><th>Department</th><th>Specialization</th><th>Phone</th><th>Account</th><th>Subjects</th><th>Actions</th></tr></thead><tbody id="faculty-table"><tr><td colspan="8">Loading faculty...</td></tr></tbody></table></section>
</main>
<div id="assign-modal" class="admin-modal hidden"><div class="admin-modal-box faculty-assign-box"><div class="admin-modal-head"><h3 id="assign-modal-title">Assign Subjects</h3><button type="button" id="close-assign">x</button></div><form id="assign-form"><div class="assignment-list" id="assign-subject-list"></div><div class="admin-actions"><button type="button" id="cancel-assign" class="admin-cancel">Cancel</button><button class="admin-primary" type="submit">Save Assignments</button></div></form></div></div>
<div id="faculty-password-modal" class="admin-modal hidden"><div class="admin-modal-box"><div class="admin-modal-head"><h3>Verify Password</h3><button type="button" id="close-faculty-password">x</button></div><p>Enter your password to view faculty details.</p><form id="faculty-password-form"><label class="admin-full">Password<input id="faculty-password" type="password" required autocomplete="current-password"></label><div class="admin-actions"><button type="button" id="cancel-faculty-password" class="admin-cancel">Cancel</button><button class="admin-primary" type="submit">Continue</button></div></form></div></div>
<div id="faculty-details-modal" class="admin-modal hidden"><div class="admin-modal-box faculty-details-box"><div class="admin-modal-head"><h3 id="faculty-details-title">Faculty Details</h3><button type="button" id="close-faculty-details">x</button></div><div id="faculty-details-body"></div></div></div>
<script type="module" src="/admin-faculty-page.js"></script>
</body>
</html>
