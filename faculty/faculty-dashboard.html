<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/png" href="/assets/logo.png"><title>Faculty Dashboard | TCSMS</title></head>
<body class="admin-shell">
<div id="tcsms-loading-screen" class="loading-screen" role="status" aria-label="Loading Thompson Christian School Management System" style="position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:.5rem;background:#102a43;color:#f7fbff"><div class="loading-mark" aria-hidden="true">T</div><p class="loading-title">TCSMS</p><p class="loading-subtitle">Preparing your workspace</p><div class="loading-spinner" aria-hidden="true"></div></div>
<main><div class="admin-page-head"><div><h2>Faculty Dashboard</h2><p>Assigned classes, schedules, and students.</p></div></div><section class="admin-summary-grid"><div class="card"><small>Assigned Classes</small><div class="stat" id="class-count">-</div></div><div class="card"><small>Scheduled Sessions</small><div class="stat" id="schedule-count">-</div></div><div class="card"><small>Active Students</small><div class="stat" id="student-count">-</div></div></section><section class="admin-table-wrap" style="margin-top:18px"><div class="admin-section-title"><h3>My Schedule</h3></div><table><thead><tr><th>Subject</th><th>Section</th><th>Room</th><th>Day</th><th>Time</th></tr></thead><tbody id="schedule-table"><tr><td colspan="5">Loading schedule...</td></tr></tbody></table></section><section class="admin-table-wrap" style="margin-top:18px"><div class="admin-section-title"><h3>My Students</h3></div><table><thead><tr><th>Student ID</th><th>Name</th><th>Grade</th><th>Status</th></tr></thead><tbody id="student-table"><tr><td colspan="4">Loading students...</td></tr></tbody></table></section></main>
<script type="module" src="/faculty/faculty-dashboard-page.js"></script></body></html>
