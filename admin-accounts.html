<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" type="image/png" href="/assets/logo.png"><title>Manage Accounts | TCSMS</title></head>
<body class="admin-shell">
<div id="tcsms-loading-screen" class="loading-screen" role="status" aria-label="Loading Thompson Christian School Management System" style="position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:.5rem;background:#102a43;color:#f7fbff">
  <div class="loading-mark" aria-hidden="true" style="display:grid;place-items:center;width:4.25rem;height:4.25rem;margin-bottom:.4rem;border:2px solid #f0b429;border-radius:50%;color:#f0b429;font-family:Georgia,serif;font-size:2rem;font-weight:700">T</div>
  <p class="loading-title" style="margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.12em">TCSMS</p>
  <p class="loading-subtitle" style="margin:0;color:#bcccdc;font-size:.85rem">Preparing your workspace</p>
  <div class="loading-spinner" aria-hidden="true" style="width:1.25rem;height:1.25rem;margin-top:.8rem;border:2px solid rgba(255,255,255,.25);border-top-color:#f0b429;border-radius:50%"></div>
</div>
<main>
  <div class="admin-page-head"><div><h2>Manage Accounts</h2><p>Review active users and their access roles.</p></div></div>
  <div class="admin-filterbar"><input id="account-search" type="search" placeholder="Search username or email"><select id="account-role"><option value="">All roles</option><option value="1">Administrator</option><option value="2">Registrar</option><option value="3">Faculty</option><option value="4">Student</option></select></div>
  <section class="admin-table-wrap"><table><thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Linked Record</th><th>Actions</th></tr></thead><tbody id="accounts-table"><tr><td colspan="6">Loading accounts...</td></tr></tbody></table></section>
</main>
<div id="account-details-modal" class="admin-modal hidden"><div class="admin-modal-box"><div class="admin-modal-head"><h3>Account Details</h3><button type="button" id="close-account-details">x</button></div><div id="account-details-body"></div></div></div>
<script type="module">
  import { supabase, requireRole, signOut } from './auth-client.js'
  import { applyUiTheme, mountProfile, mountSidebar } from './ui-theme.js'
  import { hideLoadingScreen } from './loading-screen.js'
  applyUiTheme()
  const user = await requireRole(1)
  if (!user) throw new Error('Unauthorized')
  mountProfile(user, 'Administrator', signOut)
  mountSidebar([
    { label: 'Dashboard', href: '/admin-dashboard.html', icon: '⌂' },
    { label: 'Manage Accounts', href: '/admin-accounts.html', active: true, icon: '▣' },
    { label: 'Manage Faculty', href: '/admin-faculty.html', icon: '♙' },
    { label: 'Manage Sections', href: '/admin-sections.html', icon: '▤' },
    { label: 'Manage Subjects', href: '/admin-subjects.html', icon: '♧' },
    { label: 'Manage Schedules', href: '/admin-schedules.html', icon: '▱' },
    { label: 'Curriculum Review', href: '/admin-curriculum.html', icon: '☷' },
    { label: 'Audit Trail', href: '/admin-audit.html', icon: '▤' }
  ], 'Administrative<br>Control')
  const roleNames = { 1: 'Administrator', 2: 'Registrar', 3: 'Faculty', 4: 'Student' }
  let accounts = []
  const escape = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]))
  async function loadAccounts() {
    const result = await supabase.from('users').select('username,email,role_id,is_active,student_id,user_id,initial_password,profile_picture_url').order('role_id').order('username')
    const table = document.getElementById('accounts-table')
    if (result.error) return table.innerHTML = `<tr><td colspan="6">${escape(result.error.message)}</td></tr>`
    accounts = result.data || []
    renderAccounts()
  }
  function renderAccounts() {
    const search = document.getElementById('account-search').value.trim().toLowerCase()
    const role = document.getElementById('account-role').value
    const rows = accounts.filter(item => (!role || String(item.role_id) === role) && (!search || `${item.username} ${item.email}`.toLowerCase().includes(search)))
    document.getElementById('accounts-table').innerHTML = rows.map(item => `<tr><td>${escape(item.username)}</td><td>${escape(item.email)}</td><td>${roleNames[item.role_id] || 'Unknown'}</td><td>${item.is_active ? 'Active' : 'Inactive'}</td><td>${item.student_id ? `Student #${item.student_id}` : '-'}</td><td><button class="admin-view" data-details="${item.user_id}">View / Edit</button> ${item.initial_password ? `<button class="admin-view" data-provision="${item.user_id}">Provision Login</button> ` : ''}<button class="admin-view" data-toggle="${item.user_id}" data-active="${item.is_active}">${item.is_active ? 'Deactivate' : 'Activate'}</button> <button class="admin-view" data-reset="${item.user_id}">Reset Password</button></td></tr>`).join('') || '<tr><td colspan="6">No accounts found.</td></tr>'
    document.querySelectorAll('[data-details]').forEach(button => button.onclick = () => showAccountDetails(button.dataset.details))
    document.querySelectorAll('[data-provision]').forEach(button => button.onclick = () => runAccountAction(button.dataset.provision, 'provision', button))
    document.querySelectorAll('[data-toggle]').forEach(button => button.onclick = () => runAccountAction(button.dataset.toggle, button.dataset.active === 'true' ? 'deactivate' : 'activate', button))
    document.querySelectorAll('[data-reset]').forEach(button => button.onclick = () => runAccountAction(button.dataset.reset, 'reset', button))
  }
  async function showAccountDetails(userId) {
    const item = accounts.find(account => String(account.user_id) === String(userId))
    if (!item) return
    const relation = item.student_id ? 'students' : 'staff_profiles'
    const key = item.student_id ? 'student_id' : 'user_id'
    const result = await supabase.from(relation).select('first_name,middle_name,last_name').eq(key, item.student_id || item.user_id).maybeSingle()
    const name = result.data ? `${result.data.first_name || ''} ${result.data.middle_name || ''} ${result.data.last_name || ''}`.replace(/\s+/g, ' ').trim() : '-'
    document.getElementById('account-details-body').innerHTML = `<form id="account-edit-form"><label class="admin-full">Username<input id="account-edit-username" value="${escape(item.username)}" maxlength="80" required></label><label class="admin-full">Email<input value="${escape(item.email)}" readonly></label><label class="admin-full">Role<select id="account-edit-role"><option value="1" ${item.role_id === 1 ? 'selected' : ''}>Administrator</option><option value="2" ${item.role_id === 2 ? 'selected' : ''}>Registrar</option><option value="3" ${item.role_id === 3 ? 'selected' : ''}>Faculty</option><option value="4" ${item.role_id === 4 ? 'selected' : ''}>Student</option></select></label><div class="admin-actions"><button class="admin-primary">Save Account</button></div></form><div class="review-grid"><div><small>Name</small><p>${escape(name || '-')}</p></div><div><small>Status</small><p>${item.is_active ? 'Active' : 'Inactive'}</p></div></div>${item.profile_picture_url ? `<img src="${escape(item.profile_picture_url)}" alt="Profile picture" style="width:50px;height:50px;object-fit:cover"> <button class="admin-view" data-revert-picture="${item.user_id}">Revert Picture</button>` : '<p>No profile picture.</p>'}`
    document.getElementById('account-edit-form').onsubmit = event => saveAccount(event, item.user_id)
    document.querySelector('[data-revert-picture]')?.addEventListener('click', () => revertPicture(userId))
    document.getElementById('account-details-modal').classList.remove('hidden')
  }
  async function saveAccount(event, userId) {
    event.preventDefault()
    const username = document.getElementById('account-edit-username').value.trim()
    const roleId = Number(document.getElementById('account-edit-role').value)
    if (!username) return window.alert('Username is required.')
    const { error } = await supabase.from('users').update({ username, role_id: roleId }).eq('user_id', userId)
    if (error) return window.alert(error.message)
    document.getElementById('account-details-modal').classList.add('hidden')
    await loadAccounts()
  }
  async function revertPicture(userId) {
    const { error } = await supabase.from('users').update({ profile_picture_url: null }).eq('user_id', userId)
    if (error) return window.alert(error.message)
    document.getElementById('account-details-modal').classList.add('hidden')
    await loadAccounts()
  }
  async function runAccountAction(userId, action, button) {
    button.disabled = true
    try {
      const { data, error } = await supabase.functions.invoke('provision-account', { body: { user_id: Number(userId), action } })
      if (error) return window.alert(error.message)
      if (action === 'reset') window.alert(`New temporary password for ${data.username}: ${data.temporary_password}\nShare this with the account holder securely - it will not be shown again.`)
      else if (action === 'provision') window.alert(`Login "${data.username}" is ready to use.`)
      await loadAccounts()
    } finally {
      button.disabled = false
    }
  }
  document.getElementById('account-search').oninput = renderAccounts
  document.getElementById('account-role').onchange = renderAccounts
  document.getElementById('close-account-details').onclick = () => document.getElementById('account-details-modal').classList.add('hidden')
  await loadAccounts()
  hideLoadingScreen()
</script>
</body>
</html>
