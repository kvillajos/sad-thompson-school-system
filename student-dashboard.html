<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard | TCSMS</title>
  </head>
  <body>
    <main><section class="welcome"><h2>Welcome, <span id="user-name"></span></h2><p>Your student portal will contain your profile, class schedule, grades, attendance, financial statement, and school announcements.</p></section></main>
    <script type="module">
      import { requireRole, signOut } from './auth-client.js'
      import { hideLoadingScreen } from './loading-screen.js'
      import { applyUiTheme, mountProfile, mountSidebar } from './ui-theme.js'
      applyUiTheme()
      const user = await requireRole(4)
      if (user) { document.getElementById('user-name').textContent = user.username; mountProfile(user, 'Student', signOut); mountSidebar([{ label: 'Dashboard', href: '/student-dashboard.html', active: true, icon: '⌂' }], 'Student Portal') }
      hideLoadingScreen()
    </script>
  </body>
</html>
