<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <title>Manage Schedules | TCSMS</title>
</head>
<body class="admin-shell">
<div id="tcsms-loading-screen" class="loading-screen" role="status" aria-label="Loading Thompson Christian School Management System" style="position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:.5rem;background:#102a43;color:#f7fbff">
  <div class="loading-mark" aria-hidden="true" style="display:grid;place-items:center;width:4.25rem;height:4.25rem;margin-bottom:.4rem;border:2px solid #f0b429;border-radius:50%;color:#f0b429;font-family:Georgia,serif;font-size:2rem;font-weight:700">T</div>
  <p class="loading-title" style="margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.12em">TCSMS</p>
  <p class="loading-subtitle" style="margin:0;color:#bcccdc;font-size:.85rem">Preparing your workspace</p>
  <div class="loading-spinner" aria-hidden="true" style="width:1.25rem;height:1.25rem;margin-top:.8rem;border:2px solid rgba(255,255,255,.25);border-top-color:#f0b429;border-radius:50%"></div>
</div>
<main>
  <div class="admin-page-head"><div><h2>Manage Schedules</h2><p>Choose a section to view and manage its subject schedule.</p></div></div>
  <div class="admin-filterbar"><input id="section-search" type="search" placeholder="Search section name"><select id="section-grade"><option value="">All grades</option><option value="0">Kindergarten</option><option value="1">Grade 1</option><option value="2">Grade 2</option><option value="3">Grade 3</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="8">Grade 8</option><option value="9">Grade 9</option><option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option></select></div>
  <section class="admin-table-wrap"><table><thead><tr><th>Section</th><th>Grade</th><th>Academic Year</th><th>Scheduled Subjects</th><th>Action</th></tr></thead><tbody id="sections-table"><tr><td colspan="5">Loading sections...</td></tr></tbody></table></section>
</main>
<div id="section-schedule-modal" class="admin-modal hidden"><div class="admin-modal-box faculty-details-box"><div class="admin-modal-head"><h3 id="section-schedule-title">Section Schedule</h3><button type="button" id="close-section-schedule">x</button></div><div class="admin-filterbar"><button id="add-schedule" class="admin-primary admin-action" type="button">+ Add Subject Schedule</button></div><section class="admin-table-wrap"><table><thead><tr><th>Subject</th><th>Faculty</th><th>Room</th><th>Day</th><th>Time</th><th>Actions</th></tr></thead><tbody id="section-schedules-table"></tbody></table></section></div></div>
<div id="schedule-modal" class="admin-modal hidden"><div class="admin-modal-box"><div class="admin-modal-head"><h3 id="schedule-modal-title">Add Subject Schedule</h3><button type="button" id="close-schedule">x</button></div><form id="schedule-form"><input type="hidden" name="schedule_id"><label>Subject<select name="subject_id" id="schedule-subject" required></select></label><label>Faculty<input name="faculty_name" placeholder="Optional"></label><label>Room<input name="room" placeholder="Optional"></label><label>Day<select name="day_of_week"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="7">Sunday</option></select></label><label>Start<input name="start_time" type="time" required></label><label>End<input name="end_time" type="time" required></label><div class="admin-actions"><button type="button" id="cancel-schedule" class="admin-cancel">Cancel</button><button class="admin-primary" type="submit">Save Schedule</button></div></form></div></div>
<script type="module">
  import { supabase, requireRole, signOut } from './auth-client.js'
  import { applyUiTheme, mountProfile, mountSidebar } from './ui-theme.js'
  import { hideLoadingScreen } from './loading-screen.js'
  applyUiTheme()
  const user = await requireRole(1)
  if (!user) throw new Error('Unauthorized')
  mountProfile(user, 'Administrator', signOut)
  mountSidebar([
    { label: 'Dashboard', href: '/admin-dashboard.html', icon: '⌂' },
    { label: 'Manage Accounts', href: '/admin-accounts.html', icon: '▣' },
    { label: 'Manage Faculty', href: '/admin-faculty.html', icon: '♙' },
    { label: 'Manage Sections', href: '/admin-sections.html', icon: '▤' },
    { label: 'Manage Subjects', href: '/admin-subjects.html', icon: '♧' },
    { label: 'Manage Schedules', href: '/admin-schedules.html', active: true, icon: '▱' },
    { label: 'Curriculum Review', href: '/admin-curriculum.html', icon: '☷' },
    { label: 'Audit Trail', href: '/admin-audit.html', icon: '▤' }
  ], 'Administrative<br>Control')

  const escape = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]))
  const dayNames = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
  const sectionModal = document.getElementById('section-schedule-modal')
  const scheduleModal = document.getElementById('schedule-modal')
  const scheduleForm = document.getElementById('schedule-form')
  let sections = []
  let subjects = []
  let schedules = []
  let selectedSection = null

  function closeModal(modal, form) { modal.classList.add('hidden'); form?.reset(); if (form?.elements.schedule_id) form.elements.schedule_id.value = '' }
  function sectionLabel(section) { return Number(section.grade_level) === 0 ? 'Kindergarten' : `Grade ${section.grade_level}` }
  function renderSections() {
    const search = document.getElementById('section-search').value.trim().toLowerCase()
    const grade = document.getElementById('section-grade').value
    const visible = sections.filter(section => (!grade || String(section.grade_level) === grade) && (!search || section.section_name.toLowerCase().includes(search)))
    document.getElementById('sections-table').innerHTML = visible.map(section => {
      const count = schedules.filter(item => Number(item.section_id) === Number(section.section_id)).length
      return `<tr><td>${escape(section.section_name)}</td><td>${sectionLabel(section)}</td><td>${escape(section.academic_year || '-')}</td><td>${count}</td><td><button class="admin-view" data-section="${section.section_id}">View Subjects</button></td></tr>`
    }).join('') || '<tr><td colspan="5">No matching sections.</td></tr>'
    document.querySelectorAll('[data-section]').forEach(button => button.onclick = () => openSection(sections.find(section => String(section.section_id) === button.dataset.section)))
  }
  function renderSchedules() {
    const rows = schedules.filter(item => Number(item.section_id) === Number(selectedSection?.section_id))
    document.getElementById('section-schedules-table').innerHTML = rows.map(item => `<tr><td>${escape(item.subjects?.subject_code || '')} - ${escape(item.subjects?.subject_name || '')}</td><td>${escape(item.faculty_name || '-')}</td><td>${escape(item.room || '-')}</td><td>${dayNames[item.day_of_week]}</td><td>${escape(item.start_time?.slice(0, 5))} - ${escape(item.end_time?.slice(0, 5))}</td><td><button class="admin-view" data-edit-schedule="${item.schedule_id}">Edit</button><button class="admin-remove" data-remove-schedule="${item.schedule_id}">Remove</button></td></tr>`).join('') || '<tr><td colspan="6">No subjects scheduled for this section.</td></tr>'
    document.querySelectorAll('[data-edit-schedule]').forEach(button => button.onclick = () => openSchedule(schedules.find(item => String(item.schedule_id) === button.dataset.editSchedule)))
    document.querySelectorAll('[data-remove-schedule]').forEach(button => button.onclick = () => removeSchedule(button.dataset.removeSchedule))
  }
  function openSection(section) {
    selectedSection = section
    document.getElementById('section-schedule-title').textContent = `${section.section_name} - ${sectionLabel(section)}`
    renderSchedules()
    sectionModal.classList.remove('hidden')
  }
  function openSchedule(item) {
    scheduleForm.reset()
    scheduleForm.elements.schedule_id.value = item?.schedule_id || ''
    scheduleForm.elements.subject_id.value = item?.subject_id || ''
    scheduleForm.elements.faculty_name.value = item?.faculty_name || ''
    scheduleForm.elements.room.value = item?.room || ''
    scheduleForm.elements.day_of_week.value = item?.day_of_week || '1'
    scheduleForm.elements.start_time.value = item?.start_time?.slice(0, 5) || ''
    scheduleForm.elements.end_time.value = item?.end_time?.slice(0, 5) || ''
    document.getElementById('schedule-modal-title').textContent = item ? 'Edit Subject Schedule' : 'Add Subject Schedule'
    scheduleModal.classList.remove('hidden')
  }
  async function loadData() {
    const [sectionResult, subjectResult, scheduleResult] = await Promise.all([
      supabase.from('sections').select('section_id,section_name,grade_level,academic_year').order('grade_level').order('section_name'),
      supabase.from('subjects').select('subject_id,subject_code,subject_name').eq('is_active', true).order('subject_code'),
      supabase.from('subject_schedules').select('schedule_id,subject_id,section_id,faculty_name,room,day_of_week,start_time,end_time,subjects(subject_code,subject_name)').order('day_of_week').order('start_time')
    ])
    if (sectionResult.error) return document.getElementById('sections-table').innerHTML = `<tr><td colspan="5">${escape(sectionResult.error.message)}</td></tr>`
    if (subjectResult.error) return document.getElementById('sections-table').innerHTML = `<tr><td colspan="5">${escape(subjectResult.error.message)}</td></tr>`
    if (scheduleResult.error) return document.getElementById('sections-table').innerHTML = `<tr><td colspan="5">${escape(scheduleResult.error.message)}</td></tr>`
    sections = sectionResult.data || []
    subjects = subjectResult.data || []
    schedules = scheduleResult.data || []
    document.getElementById('schedule-subject').innerHTML = subjects.map(item => `<option value="${item.subject_id}">${escape(item.subject_code)} - ${escape(item.subject_name)}</option>`).join('')
    renderSections()
    if (selectedSection) renderSchedules()
  }
  async function removeSchedule(id) {
    if (!window.confirm('Remove this subject schedule?')) return
    const result = await supabase.from('subject_schedules').delete().eq('schedule_id', id)
    if (result.error) return window.alert(result.error.message)
    await loadData()
  }
  scheduleForm.onsubmit = async event => {
    event.preventDefault()
    const values = Object.fromEntries(new FormData(scheduleForm).entries())
    const payload = { subject_id: Number(values.subject_id), section_id: Number(selectedSection.section_id), faculty_name: values.faculty_name.trim() || null, room: values.room.trim() || null, day_of_week: Number(values.day_of_week), start_time: values.start_time, end_time: values.end_time }
    const result = values.schedule_id
      ? await supabase.from('subject_schedules').update(payload).eq('schedule_id', values.schedule_id)
      : await supabase.from('subject_schedules').insert(payload)
    if (result.error) return window.alert(result.error.message)
    closeModal(scheduleModal, scheduleForm)
    await loadData()
  }
  document.getElementById('section-search').oninput = renderSections
  document.getElementById('section-grade').onchange = renderSections
  document.getElementById('add-schedule').onclick = () => openSchedule()
  document.getElementById('close-section-schedule').onclick = () => closeModal(sectionModal)
  document.getElementById('close-schedule').onclick = () => closeModal(scheduleModal, scheduleForm)
  document.getElementById('cancel-schedule').onclick = () => closeModal(scheduleModal, scheduleForm)
  await loadData()
  hideLoadingScreen()
</script>
</body>
</html>
