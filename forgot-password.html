<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Forgot Password · Thompson Christian School Management System</title>
  </head>
  <body>
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#102a43"></div>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS forgot password">
        <div id="forgot-password-container" class="card">
          <div class="brand-lockup">
            <div class="brand-copy">
              <p class="brand-name">Thompson <span>Christian</span></p>
              <p class="brand-tagline">School Management System</p>
            </div>
            <img class="brand-logo" src="/assets/logo.png" alt="Thompson Christian School seal" />
          </div>
          <h2>Forgot Password</h2>
          <p class="app-version" style="margin:-4px 0 14px">Enter the email on your account. If it's registered, we'll send you a code.</p>
          <form id="forgot-password-form">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Email" required autocomplete="email" />
            </div>
            <button type="submit">Send Code</button>
          </form>
          <div id="message" role="alert"></div>
          <p class="app-version"><a href="/index.html" style="color:#93a7c4">Back to sign in</a></p>
        </div>
      </section>
      <aside class="login-photo" aria-label="Thompson Christian School campus"></aside>
    </div>

    <script type="module" src="/forgot-password-page.js"></script>
  </body>
</html>
