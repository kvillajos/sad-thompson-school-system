<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Forgot Password · Thompson Christian School Management System</title>
  </head>
  <body class="login-page">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#091c3c"></div>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS forgot password">
        <div id="forgot-password-container" class="login-card">
          <div class="brand-lockup">
            <img class="brand-logo" src="/assets/logo.png" alt="Thompson Christian School seal" width="56" height="56" />
            <div class="brand-copy">
              <p class="brand-name">Thompson Christian School</p>
              <p class="brand-tagline">School Management System</p>
            </div>
          </div>
          <h1 class="login-title">Forgot your password?</h1>
          <p class="login-lead">Enter the email on your account. If it's registered, we'll send you a code.</p>
          <form id="forgot-password-form">
            <div class="form-group">
              <label for="email">Email</label>
              <input maxlength="150" type="email" id="email" required autocomplete="email" />
            </div>
            <button type="submit">Send code</button>
          </form>
          <div id="message" role="alert"></div>
          <p class="login-foot"><a href="/index.html">Back to sign in</a></p>
        </div>
      </section>
      <aside class="login-photo" aria-label="Thompson Christian School campus">
        <p class="login-photo-caption">Thompson Christian School, Davao City</p>
      </aside>
    </div>

    <script type="module" src="/auth/forgot-password-page.js"></script>
  </body>
</html>
