<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <title>Manage Sections | TCSMS</title>
</head>
<body class="admin-shell">
<div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#102a43"></div>
  <main>
    <div class="admin-page-head"><div><h2>Manage Sections</h2><p>Create and manage academic sections used by enrollment and placement.</p></div></div>
    <div class="admin-filterbar"><input id="section-search" type="search" placeholder="Search section name"><select id="section-grade"></select><button id="add-section" class="admin-primary admin-action" type="button">+ Add Section</button></div>
    <section class="admin-table-wrap"><table><thead><tr><th>Section Name</th><th>Grade</th><th>Academic Year</th><th>Moderator</th><th>Room</th><th>Students</th><th>Actions</th></tr></thead><tbody id="sections-table"><tr><td colspan="7">Loading sections...</td></tr></tbody></table></section>
  </main>
  <div id="section-modal" class="admin-modal hidden"><div class="admin-modal-box section-box"><div class="admin-modal-head"><h3 id="section-modal-title">Add New Section</h3><button type="button" id="close-section">x</button></div><form id="section-form"><input type="hidden" name="section_id"><label>Section Name<input name="section_name" placeholder="e.g. James" required></label><label>Grade<select name="grade_level" required></select></label><label>Capacity<input name="capacity" type="number" min="1" value="40" required></label><label>Academic Year<input name="academic_year" value="2025-2026" required></label><label>Room<input name="room" placeholder="e.g. Room 204"></label><label class="admin-full section-moderator-field"><span>Moderator</span><button type="button" id="choose-moderator" class="admin-secondary moderator-picker">Choose Faculty</button><input type="hidden" name="faculty_assigned"><div id="selected-moderator" class="moderator-card"><span>No moderator selected</span></div></label><div class="admin-actions"><button type="button" id="cancel-section" class="admin-cancel">Cancel</button><button type="submit" class="admin-primary">Save Section</button></div></form></div></div>
  <div id="moderator-modal" class="admin-modal hidden"><div class="admin-modal-box moderator-box"><div class="admin-modal-head"><h3>Choose Moderator</h3><button type="button" id="close-moderator">x</button></div><input id="moderator-search" type="search" placeholder="Search faculty"><div class="table-scroll"><table><thead><tr><th>Employee No.</th><th>Name</th><th>Department</th><th>Action</th></tr></thead><tbody id="moderator-table"></tbody></table></div></div></div>
  <script type="module" src="/admin-sections-page.js"></script>
</body>
</html>
