<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Sections | TCSMS</title>
</head>
<body class="admin-shell">
<div id="tcsms-loading-screen" class="loading-screen" role="status" aria-label="Loading Thompson Christian School Management System" style="position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:.5rem;background:#102a43;color:#f7fbff">
  <div class="loading-mark" aria-hidden="true" style="display:grid;place-items:center;width:4.25rem;height:4.25rem;margin-bottom:.4rem;border:2px solid #f0b429;border-radius:50%;color:#f0b429;font-family:Georgia,serif;font-size:2rem;font-weight:700">T</div>
  <p class="loading-title" style="margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.12em">TCSMS</p>
  <p class="loading-subtitle" style="margin:0;color:#bcccdc;font-size:.85rem">Preparing your workspace</p>
  <div class="loading-spinner" aria-hidden="true" style="width:1.25rem;height:1.25rem;margin-top:.8rem;border:2px solid rgba(255,255,255,.25);border-top-color:#f0b429;border-radius:50%"></div>
</div>
  <main>
    <div class="admin-page-head"><div><h2>Manage Sections</h2><p>Create and manage academic sections used by enrollment and placement.</p></div></div>
    <div class="admin-filterbar"><input id="section-search" type="search" placeholder="Search section name"><select id="section-grade"><option value="">All grades</option><option value="0">Kindergarten</option><option value="1">Grade 1</option><option value="2">Grade 2</option><option value="3">Grade 3</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="8">Grade 8</option><option value="9">Grade 9</option><option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option></select><button id="filter-sections" class="admin-primary" type="button">Filter</button><button id="add-section" class="admin-primary admin-action" type="button">+ Add Section</button></div>
    <section class="admin-table-wrap"><table><thead><tr><th>Section Name</th><th>Grade</th><th>Academic Year</th><th>Semester</th><th>Faculty Assigned</th><th>Students</th><th>Actions</th></tr></thead><tbody id="sections-table"><tr><td colspan="7">Loading sections...</td></tr></tbody></table></section>
  </main>
  <div id="section-modal" class="admin-modal hidden"><div class="admin-modal-box"><div class="admin-modal-head"><h3 id="section-modal-title">Add New Section</h3><button type="button" id="close-section">x</button></div><form id="section-form"><input type="hidden" name="section_id"><label>Section Name<input name="section_name" placeholder="e.g. James" required></label><label>Grade<select name="grade_level" required><option value="">Select Grade</option><option value="0">Kindergarten</option><option value="1">Grade 1</option><option value="2">Grade 2</option><option value="3">Grade 3</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="8">Grade 8</option><option value="9">Grade 9</option><option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option></select></label><label>Capacity<input name="capacity" type="number" min="1" value="40" required></label><label>Academic Year<input name="academic_year" value="2025-2026" required></label><label>Semester<select name="semester"><option>1st Semester</option><option>2nd Semester</option></select></label><label class="admin-full">Faculty Assigned (optional)<input name="faculty_assigned" placeholder="e.g. Dr. Sarah Smith"></label><div class="admin-actions"><button type="button" id="cancel-section" class="admin-cancel">Cancel</button><button type="submit" class="admin-primary">Save Section</button></div></form></div></div>
  <script type="module">
    import { supabase, requireRole, signOut } from './auth-client.js'
    import { applyUiTheme, mountProfile, mountSidebar } from './ui-theme.js'
    import { hideLoadingScreen } from './loading-screen.js'
    applyUiTheme()
    const user = await requireRole(1)
    if (!user) throw new Error('Unauthorized')
    mountProfile(user, 'Administrator', signOut)
    hideLoadingScreen()
    mountSidebar([
      { label: 'Dashboard', href: '/admin-dashboard.html', icon: '⌂' },
      { label: 'Manage Accounts', href: '/admin-accounts.html', icon: '▣' },
      { label: 'Manage Faculty', href: '/admin-faculty.html', icon: '♙' },
      { label: 'Manage Sections', href: '/admin-sections.html', active: true, icon: '▤' },
      { label: 'Manage Subjects', href: '/admin-subjects.html', icon: '♧' },
      { label: 'Curriculum Review', href: '/admin-curriculum.html', icon: '☷' }
    ], 'Administrative<br>Control')
    const modal = document.getElementById('section-modal')
    const form = document.getElementById('section-form')
    const modalTitle = document.getElementById('section-modal-title')
    const close = () => { modal.classList.add('hidden'); form.reset(); form.elements.section_id.value = '' }
    const openForm = section => {
      form.reset()
      form.elements.section_id.value = section?.section_id || ''
      form.elements.section_name.value = section?.section_name || ''
      form.elements.grade_level.value = section?.grade_level ?? ''
      form.elements.capacity.value = section?.capacity || 40
      form.elements.academic_year.value = section?.academic_year || '2025-2026'
      form.elements.semester.value = section?.semester || '1st Semester'
      form.elements.faculty_assigned.value = section?.faculty_assigned || ''
      modalTitle.textContent = section ? 'Edit Section' : 'Add New Section'
      modal.classList.remove('hidden')
    }
    document.getElementById('add-section').onclick = () => openForm()
    document.getElementById('close-section').onclick = close
    document.getElementById('cancel-section').onclick = close
    const escape = value => String(value ?? '').replace(/[&<>\"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]))
    async function loadSections() {
      const table = document.getElementById('sections-table')
      const { data, error } = await supabase.from('sections').select('section_id,section_name,grade_level,capacity,academic_year,semester,faculty_assigned').order('grade_level').order('section_name')
      if (error) return table.innerHTML = `<tr><td colspan="7">${escape(error.message)}</td></tr>`
      const { data: enrollments, error: enrollmentError } = await supabase.from('enrollments').select('section_id').eq('status', 'active')
      if (enrollmentError) return table.innerHTML = `<tr><td colspan="7">${escape(enrollmentError.message)}</td></tr>`
      const counts = (enrollments || []).reduce((result, row) => { result[row.section_id] = (result[row.section_id] || 0) + 1; return result }, {})
      const search = document.getElementById('section-search').value.trim().toLowerCase()
      const grade = document.getElementById('section-grade').value
      const visibleSections = (data || []).filter(section => (!grade || String(section.grade_level) === grade) && (!search || section.section_name.toLowerCase().includes(search)))
      table.innerHTML = visibleSections.map(section => `<tr><td>${escape(section.section_name)}</td><td>${Number(section.grade_level) === 0 ? 'Kindergarten' : `Grade ${section.grade_level}`}</td><td>${escape(section.academic_year || '-')}</td><td>${escape(section.semester || '-')}</td><td>${escape(section.faculty_assigned || 'Unassigned')}</td><td>${counts[section.section_id] || 0} / ${Number(section.capacity) || 0}</td><td><button class="admin-view" data-edit="${section.section_id}">Edit</button><button class="admin-remove" data-remove="${section.section_id}">Remove</button></td></tr>`).join('') || '<tr><td colspan="7">No matching sections.</td></tr>'
      document.querySelectorAll('[data-remove]').forEach(button => button.onclick = () => removeSection(button.dataset.remove))
      document.querySelectorAll('[data-edit]').forEach(button => button.onclick = () => openForm(data.find(item => String(item.section_id) === String(button.dataset.edit))))
    }
    async function removeSection(id) {
      const { count, error: countError } = await supabase.from('enrollments').select('id', { count: 'exact', head: true }).eq('section_id', id).eq('status', 'active')
      if (countError) return window.alert(countError.message)
      if (count) return window.alert('This section has active students. Move them to another section before removing it.')
      if (!window.confirm('Remove this section?')) return
      const { error } = await supabase.from('sections').delete().eq('section_id', id)
      if (error) return window.alert(error.message)
      await loadSections()
    }
    form.onsubmit = async event => {
      event.preventDefault()
      const submitButton = form.querySelector('button[type="submit"]')
      submitButton.disabled = true
      const values = Object.fromEntries(new FormData(form).entries())
      const payload = { section_name: values.section_name.trim(), grade_level: Number(values.grade_level), capacity: Number(values.capacity), academic_year: values.academic_year.trim(), semester: values.semester, faculty_assigned: values.faculty_assigned.trim() || null }
      const sectionId = values.section_id
      if (sectionId) {
        const { count, error: countError } = await supabase.from('enrollments').select('id', { count: 'exact', head: true }).eq('section_id', sectionId).eq('status', 'active')
        if (countError) { submitButton.disabled = false; return window.alert(countError.message) }
        if (count > payload.capacity) { submitButton.disabled = false; return window.alert(`Capacity cannot be lower than the ${count} active students in this section.`) }
      }
      const result = sectionId
        ? await supabase.from('sections').update(payload).eq('section_id', sectionId)
        : await supabase.from('sections').insert(payload)
      submitButton.disabled = false
      if (result.error) return window.alert(result.error.message)
      close()
      await loadSections()
    }
    document.getElementById('filter-sections').onclick = loadSections
    document.getElementById('section-search').onkeydown = event => { if (event.key === 'Enter') loadSections() }
    loadSections()
  </script>
</body>
</html>
