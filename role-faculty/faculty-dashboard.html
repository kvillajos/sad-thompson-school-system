<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Faculty Dashboard | TCSMS</title>
  </head>
  <body class="admin-shell">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#091c3c"></div>
    <main>
      <div class="admin-page-head">
        <div><h2>Faculty Dashboard</h2></div>
      </div>
      <div id="announcements-host"></div>
      <section class="admin-table-wrap hidden" id="notice-section">
        <div class="admin-section-title"><h3>Notices</h3></div>
        <table>
          <tbody id="notice-table"></tbody>
        </table>
      </section>
      <section class="admin-table-wrap" style="margin-top:18px">
        <div class="admin-section-title"><h3>My Schedule</h3></div>
        <div id="schedule-days"><p>Loading schedule...</p></div>
      </section>
      <section class="admin-table-wrap" style="margin-top:18px">
        <div class="admin-section-title">
          <h3>My Classes</h3>
          <a class="admin-secondary" href="/role-faculty/faculty-class-list.html">Open Class List</a>
        </div>
        <table style="min-width:0; width:100%">
          <thead>
            <tr>
              <th>Class</th>
              <th>Students</th>
              <th>Male</th>
              <th>Female</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="class-counts">
            <tr>
              <td colspan="5">Loading classes...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/role-faculty/faculty-dashboard-page.js"></script>
  </body>
</html>
