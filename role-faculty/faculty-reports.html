<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Report Generation | TCSMS</title>
  </head>
  <body class="admin-shell">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#102a43"></div>
    <main>
      <div class="admin-page-head">
        <div><h2>Report Generation</h2></div>
      </div>
      <section class="admin-table-wrap" style="overflow:visible">
        <div class="admin-filterbar">
          <input id="report-student" aria-label="Student" placeholder="Search student name or LRN" /><input
            maxlength="9"
            id="report-year"
            aria-label="School year"
            placeholder="2026-2027"
          /><button id="generate-report" class="admin-primary" type="button">Generate Report</button>
        </div>
        <div id="report-student-info" class="student-info-card" hidden></div>
      </section>
      <section class="admin-table-wrap">
        <div class="admin-section-title"><h3>Sample Layout</h3></div>
        <p class="note">A blank example of the report card. The real one is filled in with the student's details and grades.</p>
        <div id="report-sample" class="pdf-sheet" style="width: auto; margin-top: 16px; overflow-x: auto"></div>
      </section>
    </main>
    <div id="faculty-report-preview" class="report-print-card" aria-hidden="true"></div>
    <script type="module" src="/role-faculty/faculty-reports-page.js"></script>
  </body>
</html>
