<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Grades | TCSMS</title>
  </head>
  <body class="admin-shell">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#091c3c"></div>
    <main>
      <div class="admin-page-head">
        <div><h2>Grades</h2></div>
      </div>
      <section class="admin-table-wrap">
        <div class="admin-filterbar">
          <select id="grade-class" aria-label="Class"></select
          ><input maxlength="9" id="grade-year" aria-label="School year" placeholder="2026-2027" /><button
            id="load-grades"
            class="admin-primary"
            type="button"
          >
            Refresh</button
          ><button id="save-grades" class="admin-primary" type="button">Save Grades</button
          ><button id="lock-grades" class="admin-secondary" type="button">Submit &amp; Lock</button>
        </div>
        <div style="overflow:auto">
          <table>
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>Q1</th>
                <th>Q2</th>
                <th>Q3</th>
                <th>Q4</th>
                <th>Final Grade</th>
                <th>Letter Grade</th>
                <th>Remarks</th>
              </tr>
            </thead>
            <tbody id="grade-table">
              <tr>
                <td colspan="9">Loading class...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <section class="admin-table-wrap">
        <div class="admin-section-title">
          <h3>My Students' Grades</h3>
          <input id="all-grades-search" type="search" aria-label="Search grades" placeholder="Search student, section or subject" />
        </div>
        <div style="overflow: auto">
          <table>
            <thead>
              <tr>
                <th>Student No.</th>
                <th>Student</th>
                <th>Section</th>
                <th>Subject</th>
                <th>Q1</th>
                <th>Q2</th>
                <th>Q3</th>
                <th>Q4</th>
                <th>Final Grade</th>
                <th>Letter Grade</th>
              </tr>
            </thead>
            <tbody id="all-grades-table">
              <tr>
                <td colspan="10">Loading grades...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/role-faculty/faculty-grades-page.js"></script>
  </body>
</html>
