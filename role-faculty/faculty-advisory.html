<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>My Advisory | TCSMS</title>
  </head>
  <body class="admin-shell">
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#091c3c"></div>
    <main>
      <div class="admin-page-head">
        <div><h2>My Advisory</h2></div>
      </div>
      <div class="admin-filterbar">
        <select id="advisory-section" aria-label="Advisory section"></select>
      </div>
      <p class="year-summary" id="advisory-summary"></p>
      <div class="subtabs" role="tablist" id="advisory-tabs">
        <button type="button" class="subtab active" data-advisory-tab="grades" role="tab">Grades</button
        ><button type="button" class="subtab" data-advisory-tab="attendance" role="tab">Attendance</button
        ><button type="button" class="subtab" data-advisory-tab="requests" role="tab">Requests</button
        ><button type="button" class="subtab" data-advisory-tab="discipline" role="tab">Discipline</button>
      </div>

      <section class="admin-table-wrap" data-advisory-panel="grades">
        <div class="admin-section-title">
          <h3>Grades, every subject</h3>
          <label class="scale-year"
            >Show<select id="advisory-grade-field">
              <option value="first_sem_q1">Q1</option>
              <option value="first_sem_q2">Q2</option>
              <option value="second_sem_q1">Q3</option>
              <option value="second_sem_q2">Q4</option>
              <option value="final" selected>Final</option>
            </select></label
          >
        </div>
        <div style="overflow:auto"><table id="advisory-grades"></table></div>
      </section>
      <section class="admin-table-wrap hidden" data-advisory-panel="attendance">
        <div class="admin-section-title"><h3>Attendance this school year</h3></div>
        <p class="admin-note">Counts are per class meeting, the same way the student's own dashboard counts them.</p>
        <table id="advisory-attendance"></table>
      </section>
      <section class="admin-table-wrap hidden" data-advisory-panel="requests">
        <div class="admin-section-title"><h3>Requests from my students</h3></div>
        <table id="advisory-requests"></table>
      </section>
      <section class="admin-table-wrap hidden" data-advisory-panel="discipline">
        <div class="admin-section-title"><h3>Discipline</h3></div>
        <div id="advisory-discipline"></div>
      </section>
    </main>
    <script type="module" src="/role-faculty/faculty-advisory-page.js"></script>
  </body>
</html>
