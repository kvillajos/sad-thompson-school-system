<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Set New Password · Thompson Christian School Management System</title>
  </head>
  <body>
    <div id="tcsms-loading-screen" class="loading-screen" style="position:fixed;inset:0;background:#102a43"></div>

    <div class="login-layout">
      <section class="login-panel" aria-label="TCSMS set new password">
        <div id="reset-password-container" class="card">
          <div class="brand-lockup">
            <div class="brand-copy">
              <p class="brand-name">Thompson <span>Christian</span></p>
              <p class="brand-tagline">School Management System</p>
            </div>
            <img class="brand-logo" src="/assets/logo.png" alt="Thompson Christian School seal" />
          </div>
          <h2>Set New Password</h2>
          <form id="reset-password-form">
            <div class="form-group">
              <label for="new-password">New Password</label>
              <input type="password" id="new-password" placeholder="New Password" required autocomplete="new-password" minlength="8" />
            </div>
            <div class="pw-meter" aria-live="polite">
              <div class="pw-bar"><span id="pw-fill"></span></div>
              <small id="pw-label">Enter a password</small>
              <ul id="pw-rules"></ul>
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm Password</label>
              <input type="password" id="confirm-password" placeholder="Confirm Password" required autocomplete="new-password" minlength="8" />
            </div>
            <button type="submit">Update Password</button>
          </form>
          <div id="message" role="alert"></div>
        </div>
      </section>
      <aside class="login-photo" aria-label="Thompson Christian School campus"></aside>
    </div>

    <script type="module" src="/reset-password-page.js"></script>
  </body>
</html>
